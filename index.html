<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>INIBISA — Something Good is Cooking</title>
    <meta
      name="description"
      content="INIBISA sedang menyiapkan sesuatu yang baru. Website dan produk digital segera hadir."
    >
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="coming-soon" aria-labelledby="page-title">
      <div class="ambient ambient-cyan" aria-hidden="true"></div>
      <div class="ambient ambient-blue" aria-hidden="true"></div>
      <div class="ambient ambient-magenta" aria-hidden="true"></div>

      <section class="hero-card">
        <div class="decor decor-ring" aria-hidden="true"></div>
        <div class="decor decor-curve decor-curve-a" aria-hidden="true"></div>
        <div class="decor decor-curve decor-curve-b" aria-hidden="true"></div>
        <div class="decor decor-dot decor-dot-a" aria-hidden="true"></div>
        <div class="decor decor-dot decor-dot-b" aria-hidden="true"></div>

        <div class="hero-content">
          <div class="brand-mark reveal reveal-logo">
            <img src="assets/logo.png" alt="Logo INIBISA" width="1254" height="1254">
          </div>
          <h1 class="headline reveal reveal-two" id="page-title">
            <span>Something is</span>
            <span><strong>Cooking.</strong></span>
          </h1>

          <p class="supporting-copy reveal reveal-three">
            Something useful is coming soon.
          </p>

          <div class="cta-row reveal reveal-four">
            <span class="coming-button" aria-label="Coming Soon">
              <span class="button-accent" aria-hidden="true"></span>
              Coming Soon
            </span>
            <p>Stay tuned.</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
